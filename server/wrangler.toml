# Servidor de notificações do Agentonator (Cloudflare Workers — plano gratuito).
name = "agentonator-push"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Um "Durable Object" por aparelho guarda os lembretes e dispara cada aviso na hora (alarm).
[[durable_objects.bindings]]
name = "PUSH"
class_name = "PushDevice"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PushDevice"]

[observability]
enabled = true
