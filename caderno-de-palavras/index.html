<title>Caderno de Palavras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..500&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --surface-2:#E9EDF7; --ink:#151836; --muted:#596084; --rule:#D9DEEE;
  --accent:#2340C8; --accent-ink:#FFFFFF; --accent-soft:#E2E7FB; --margin:#E07A8D; --line:rgba(35,64,200,.085);
  --ok:#157A4B; --ok-soft:#E0F2E9; --bad:#B02236; --bad-soft:#FBE5E8; --warn:#8F5B00; --warn-soft:#FFF1D6;
  --shadow:0 1px 2px rgba(21,24,54,.06), 0 4px 16px rgba(21,24,54,.05);
  --serif:"Literata", Georgia, "Times New Roman", serif;
  --sans:"Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1122; --surface:#161A31; --surface-2:#1E2342; --ink:#E7E9F7; --muted:#9CA2C6; --rule:#2B3156;
    --accent:#93A6FF; --accent-ink:#0E1122; --accent-soft:#232B57; --margin:#C8687A; --line:rgba(147,166,255,.07);
    --ok:#5CD198; --ok-soft:#12302A; --bad:#FF8C9A; --bad-soft:#3A1822; --warn:#F1BA58; --warn-soft:#382B12;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1122; --surface:#161A31; --surface-2:#1E2342; --ink:#E7E9F7; --muted:#9CA2C6; --rule:#2B3156;
  --accent:#93A6FF; --accent-ink:#0E1122; --accent-soft:#232B57; --margin:#C8687A; --line:rgba(147,166,255,.07);
  --ok:#5CD198; --ok-soft:#12302A; --bad:#FF8C9A; --bad-soft:#3A1822; --warn:#F1BA58; --warn-soft:#382B12;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:18px 72px}

/* topo */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--rule)}
.brand{font-family:var(--serif);font-weight:600;font-size:21px;letter-spacing:-.01em;margin:0;display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:999px}
.tabs button{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:14px;padding:7px 14px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.meta{display:flex;gap:6px 18px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:12px;font-variant-numeric:tabular-nums}
.meta b{color:var(--ink);font-weight:600}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)}

/* tipografia */
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.h{font-family:var(--serif);font-weight:600;font-size:clamp(26px,5.2vw,34px);line-height:1.15;letter-spacing:-.015em;margin:6px 0 8px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 20px;max-width:62ch}
.stack{display:grid;gap:10px}
.page{padding-top:26px}

/* botões */
.btn{appearance:none;border:1px solid transparent;border-radius:10px;font-weight:600;font-size:14px;padding:9px 16px;min-height:42px;cursor:pointer;line-height:1.2;color:var(--ink);background:var(--surface-2)}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:transparent;color:var(--muted);border-color:var(--rule)}
.btn-ghost:hover{color:var(--ink);border-color:var(--muted)}
.btn-lg{font-size:16px;padding:13px 22px;min-height:50px;border-radius:12px}
.btn[disabled]{opacity:.55;cursor:default}
.link{border:0;background:none;color:var(--accent);font-weight:600;font-size:14px;cursor:pointer;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* como funciona */
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 22px;padding:0;list-style:none;counter-reset:how}
.how li{counter-increment:how;font-size:14px;color:var(--muted);padding-top:10px;border-top:2px solid var(--rule)}
.how li::before{content:counter(how);display:block;font-family:var(--serif);font-weight:600;font-size:20px;color:var(--accent);margin-bottom:2px}
.how b{color:var(--ink);font-weight:600}
@media (max-width:560px){.how{grid-template-columns:1fr}}

/* sugestões */
.opt{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px 16px;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:16px 16px 16px 20px;transition:border-color .15s}
.opt:hover{border-color:color-mix(in srgb, var(--accent) 45%, var(--rule))}
.opt .word{font-family:var(--serif);font-size:27px;font-weight:600;line-height:1.1;letter-spacing:-.01em}
.opt .sub{color:var(--muted);font-size:13px;margin-top:5px;display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:540px){.opt{grid-template-columns:1fr}.acts{justify-content:flex-start}}
.badge{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.cls{font-family:var(--serif);font-style:italic;color:var(--accent)}
.note{background:var(--surface-2);border-radius:12px;padding:14px 16px;font-size:14px;color:var(--muted);margin-top:18px}
.note b{color:var(--ink)}

/* verbete */
.entry{position:relative;border:1px solid var(--rule);border-radius:var(--r);padding:26px 22px 26px 46px;overflow:hidden;
  background:linear-gradient(var(--line) 1px, transparent 1px) 0 13px / 100% 30px, var(--surface)}
.entry::before{content:"";position:absolute;left:28px;top:0;bottom:0;width:2px;background:var(--margin);opacity:.55}
.hw{font-family:var(--serif);font-size:clamp(40px,10vw,62px);font-weight:600;line-height:1.02;letter-spacing:-.025em;margin:8px 0 10px;overflow-wrap:anywhere}
.pron{display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px;font-size:15px}
.syl{font-family:var(--serif);font-size:18px;color:var(--muted);letter-spacing:.01em}
.syl b{color:var(--ink);font-weight:700}
.def{font-family:var(--serif);font-size:clamp(19px,3.6vw,22px);line-height:1.45;margin:16px 0 0;max-width:34em}
.listen{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px 5px 9px;font-size:13px;font-weight:600;cursor:pointer}
.listen:hover{border-color:var(--accent);color:var(--accent)}
.mini{border:0;background:none;color:var(--muted);cursor:pointer;padding:4px;border-radius:6px;vertical-align:middle;line-height:0}
.mini:hover{color:var(--accent)}
.sec{margin-top:30px}
.sec h2{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.ex{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.ex li{font-family:var(--serif);font-size:18px;line-height:1.5;padding-left:16px;border-left:2px solid var(--accent-soft);display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
mark{background:var(--accent-soft);color:var(--ink);padding:0 .18em;border-radius:4px;font-weight:600}
.tbl{overflow-x:auto;border:1px solid var(--rule);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--rule);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface-2);white-space:nowrap}
td.f{font-family:var(--serif);font-weight:600;font-size:17px;white-space:nowrap}
td.p{color:var(--muted);white-space:nowrap;font-size:14px}
td.c{font-family:var(--serif);font-size:16.5px;white-space:nowrap}
@media (max-width:480px){th,td{padding:9px 10px}td.p{white-space:normal}}
.foot{font-size:13.5px;color:var(--muted);margin-top:10px}
.foot b{color:var(--ink);font-family:var(--serif)}
.pairs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:520px){.pairs{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:4px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--rule);font-size:14px}
.tip{background:var(--warn-soft);border-radius:12px;padding:14px 16px;font-size:15px}
.tip b{color:var(--warn)}
.cta{margin-top:32px;display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap}
.cta span{color:var(--muted);font-size:14px}

/* prova */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sectag{font-weight:600;color:var(--ink)}
.sectag.rev{color:var(--warn)}
.bar{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.qcard{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:22px 20px;margin-top:16px;box-shadow:var(--shadow)}
.qp{font-family:var(--serif);font-size:clamp(20px,4.4vw,24px);line-height:1.42;margin:10px 0 18px;text-wrap:pretty}
.blank{display:inline-block;min-width:4.2em;border-bottom:2px solid var(--accent);height:1.05em;vertical-align:-.15em}
.filled{border-bottom:2px solid currentColor;padding:0 .12em;font-weight:600}
.filled.ok{color:var(--ok)} .filled.bad{color:var(--bad)}
.choices{display:grid;gap:8px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--bg);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;font-size:16px;font-weight:500;line-height:1.4;color:var(--ink);cursor:pointer}
.choice .l{flex:none;width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted)}
.choice:hover:not([disabled]){border-color:var(--accent)}
.choice[disabled]{cursor:default}
.choice.is-ok{border-color:var(--ok);background:var(--ok-soft)}
.choice.is-ok .l{background:var(--ok);color:var(--surface)}
.choice.is-bad{border-color:var(--bad);background:var(--bad-soft)}
.choice.is-bad .l{background:var(--bad);color:var(--surface)}
.choice.dim{opacity:.6}
.hint{font-size:14px;color:var(--muted);margin:-6px 0 14px}
.typed{display:flex;gap:8px;flex-wrap:wrap}
.typed input{flex:1 1 220px;min-width:0;font-family:var(--serif);font-size:19px;padding:11px 14px;border-radius:12px;border:1px solid var(--rule);background:var(--bg);color:var(--ink)}
.typed input:focus{border-color:var(--accent);outline:none}
.fb{margin-top:16px;border-radius:12px;padding:14px 16px}
.fb.ok{background:var(--ok-soft)} .fb.bad{background:var(--bad-soft)}
.fb h3{margin:0 0 6px;font-size:16px}
.fb.ok h3{color:var(--ok)} .fb.bad h3{color:var(--bad)}
.fb p{margin:6px 0 0;font-size:15px}
.fb .ans{font-family:var(--serif);font-weight:600}
.next{margin-top:16px;display:flex;justify-content:flex-end}

/* resultado */
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:18px}
.score > div{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:16px 18px}
.score .n{font-family:var(--serif);font-size:40px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;margin-top:6px}
.score .n small{font-size:20px;color:var(--muted);font-weight:500}
.score .k{font-size:13px;color:var(--muted)}
.miss{background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--bad);border-radius:12px;padding:14px 16px}
.miss .qp{font-size:17px;margin:4px 0 8px}
.miss p{margin:4px 0;font-size:14.5px}
.clock{font-variant-numeric:tabular-nums}

/* lista */
.row{display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:12px 16px;cursor:pointer;text-align:left;width:100%;color:var(--ink);font-size:14px}
.row:hover{border-color:var(--accent)}
.row .word{font-family:var(--serif);font-size:20px;font-weight:600}
.row .sub{color:var(--muted);font-size:13px}
.row .right{text-align:right;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
.pill.rev{background:var(--warn-soft);color:var(--warn)}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.new{background:var(--accent-soft);color:var(--accent)}
.kchip{display:inline-flex;align-items:center;gap:4px;padding:4px 6px 4px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--rule);font-family:var(--serif);font-size:15px}
.kchip button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:12px;font-family:var(--sans);font-weight:600;padding:3px 8px;border-radius:999px}
.kchip button:hover{background:var(--surface-2);color:var(--accent)}
.empty{color:var(--muted);font-size:14px}
.back{margin-bottom:12px}

/* aviso flutuante */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 10px 10px 16px;display:flex;gap:14px;align-items:center;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px);z-index:10}
.toast button{border:0;background:transparent;color:var(--bg);font-weight:700;cursor:pointer;padding:6px 10px;border-radius:8px;text-decoration:underline;text-underline-offset:3px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
<div class="wrap">
  <header class="top">
    <h1 class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="3" y="2" width="20" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><line x1="8" y1="2" x2="8" y2="24" stroke="var(--margin)" stroke-width="1.6"/><line x1="11" y1="9" x2="19" y2="9" stroke="currentColor" stroke-width="1.4" opacity=".5"/><line x1="11" y1="13" x2="19" y2="13" stroke="currentColor" stroke-width="1.4" opacity=".5"/><line x1="11" y1="17" x2="16" y2="17" stroke="currentColor" stroke-width="1.4" opacity=".5"/></svg>
      Caderno de Palavras
    </h1>
    <nav class="tabs" role="tablist" aria-label="Seções">
      <button id="tab-hoje" role="tab" data-act="tab" data-id="hoje" aria-selected="true">Hoje</button>
      <button id="tab-lista" role="tab" data-act="tab" data-id="lista" aria-selected="false">Minhas palavras</button>
    </nav>
  </header>
  <div class="meta" id="meta"></div>
  <main id="app" aria-live="polite"></main>
</div>
<div id="toast-slot"></div>
<script>
const BANK = [];
// Banco de palavras (parte 1). Formato de cada item:
// id, w (palavra), c (classe), syl (sílabas, ^ = tônica), def, g (sentido curto),
// fam [[forma, classe, sentido]], verb (infinitivo, opcional), ex (frases com *destaque*),
// q [[frase com ___, resposta, [3 erradas], explicação, base]], u [certa, [erradas], explicação],
// syn, ant, tip
BANK.push(
{id:"ludibriar", w:"ludibriar", c:"v", syl:"lu-di-bri-^ar",
 def:"Enganar alguém de forma esperta, geralmente para tirar alguma vantagem.",
 g:"enganar alguém com esperteza",
 fam:[["ludibriar","v","enganar com astúcia"],["ludíbrio","sm","o engano, a trapaça"],["ludibriado","adj","que foi enganado"]],
 verb:"ludibriar",
 ex:["Não se deixe *ludibriar* por promoções que parecem boas demais para ser verdade.","Ele se sentiu *ludibriado* quando descobriu que o carro já tinha sido batido.","Aquele anúncio foi puro *ludíbrio*: o produto nem existia."],
 q:[["O golpista ___ dezenas de aposentados com falsas promessas de lucro no ano passado.","ludibriou",["ludíbrio","ludibriado","ludibriar"],"A ação já aconteceu e o sujeito é “o golpista” (ele): pretérito perfeito, ele ludibriou.","ludibriar"],
    ["Depois de ler as letras miúdas, percebi que tinha sido ___.","ludibriado",["ludibriou","ludíbrio","ludibriando"],"Depois de “ter sido” usamos o particípio: fui ludibriado = fui enganado.","ludibriar"],
    ["A propaganda enganosa é um ___ contra o consumidor.","ludíbrio",["ludibriado","ludibriar","ludibria"],"Depois do artigo “um” precisamos de um substantivo: o ludíbrio (o engano).","ludibriar"],
    ["Eles estão sempre tentando nos ___ com esse papo de investimento garantido.","ludibriar",["ludibriamos","ludíbrio","ludibriado"],"Depois de “tentar” o verbo fica no infinitivo: tentar ludibriar.","ludibriar"]],
 u:["O vendedor tentou me ludibriar, mas eu li o contrato inteiro.",["Ela ludibriou de alegria quando recebeu a notícia.","Vou ludibriar a mesa antes do jantar."],"Ludibriar é sempre enganar alguém. Não tem relação com alegria nem com arrumar coisas."],
 syn:["enganar","iludir","tapear","engambelar"], ant:["esclarecer","alertar"],
 tip:"Estrutura: ludibriar alguém. No dia a dia, “enganar” é mais comum; “ludibriar” soa mais forte e mais formal."},

{id:"corroborar", w:"corroborar", c:"v", syl:"cor-ro-bo-^rar",
 def:"Confirmar ou reforçar uma ideia, uma informação ou uma suspeita com novas provas ou argumentos.",
 g:"confirmar algo com provas ou argumentos",
 fam:[["corroborar","v","confirmar, reforçar"],["corroboração","sf","a confirmação"],["corroborado","adj","confirmado"]],
 verb:"corroborar",
 ex:["Os exames *corroboraram* o que o médico já suspeitava.","Não tenho como *corroborar* essa história, eu não estava lá.","A *corroboração* das testemunhas foi decisiva para o caso."],
 q:[["Ontem, os exames ___ a suspeita do médico.","corroboraram",["corroboração","corroborando","corroborado"],"“Ontem” indica passado e o sujeito é “os exames” (eles): pretérito perfeito, eles corroboraram.","corroborar"],
    ["O depoimento da vizinha serviu de ___ para a versão do porteiro.","corroboração",["corroborar","corroborado","corroborou"],"Depois de “serviu de” precisamos de um substantivo: a corroboração.","corroborar"],
    ["A hipótese só foi aceita depois de ser ___ por outros pesquisadores.","corroborada",["corroborou","corroboração","corroborar"],"Depois de “ser” vem o particípio, que concorda com “a hipótese” (feminino): corroborada.","corroborar"],
    ["Pode anotar: eu ___ cada palavra que ela está dizendo.","corroboro",["corroboração","corrobora","corroborado"],"Sujeito “eu” no presente: eu corroboro.","corroborar"]],
 u:["As fotos corroboram a versão do motorista.",["Vou corroborar o bolo com chocolate.","Ele corroborou de medo durante o filme."],"Corroborar é confirmar ou reforçar uma informação. Não é decorar nem reagir com medo."],
 syn:["confirmar","comprovar","reforçar"], ant:["refutar","desmentir","contradizer"],
 tip:"Muito usado em notícias, relatórios e discussões: “os números corroboram a tese”."},

{id:"mitigar", w:"mitigar", c:"v", syl:"mi-ti-^gar",
 def:"Diminuir a intensidade ou os efeitos de algo ruim, como um risco, uma dor ou um prejuízo.",
 g:"diminuir os efeitos de algo ruim",
 fam:[["mitigar","v","suavizar, reduzir"],["mitigação","sf","a redução de um risco ou dano"],["mitigado","adj","reduzido, atenuado"]],
 verb:"mitigar",
 ex:["Beber bastante água ajuda a *mitigar* os efeitos do calor.","A empresa criou um plano de *mitigação* de riscos para a troca de sistema.","Com a conferência dupla, *mitigamos* a chance de erro nos relatórios."],
 q:[["Na semana passada, eu ___ o problema ligando para cada cliente afetado.","mitiguei",["mitigação","mitigou","mitigado"],"Sujeito “eu” no passado: eu mitiguei. O “g” vira “gu” antes do “e” para manter o som (mitig + ei = mitiguei).","mitigar"],

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CLS = {v:'verbo', sf:'substantivo feminino', sm:'substantivo masculino', adj:'adjetivo', adv:'advérbio'};
const clsName = c => CLS[c] || c || '';
const pad = n => String(n).padStart(2, '0');
const strip = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '');

const clone = o => JSON.parse(JSON.stringify(o));
const LETTERS = 'ABCDE';
const UNLOCK_HOUR = 6;
const REVIEW_WORDS = 5;

function seedFrom(str){ let h = 1779033703 ^ str.length; for (let i = 0; i < str.length; i++){ h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; } h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); return (h ^= h >>> 16) >>> 0; }
function rngFrom(str){ let a = seedFrom(str); return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(arr, rng){ const a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const pick = (arr, rng) => arr[Math.floor(rng() * arr.length)];

// O "dia" do caderno vira às 6h (hora local): antes disso ainda vale o dia anterior.
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dayKey = (d = new Date()) => keyOf(new Date(d.getTime() - UNLOCK_HOUR * 3600e3));
function dayDate(k){ const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d, 12); }
const fmtDay = k => dayDate(k).toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'long'});
const fmtShort = k => dayDate(k).toLocaleDateString('pt-BR', {day:'numeric', month:'short'}).replace('.', '');
function nextUnlock(){ const n = new Date(), t = new Date(n); t.setHours(UNLOCK_HOUR, 0, 0, 0); if (t <= n) t.setDate(t.getDate() + 1); return t; }
function countdown(){ const ms = nextUnlock() - new Date(); const h = Math.floor(ms / 3600e3), m = Math.floor(ms % 3600e3 / 60e3); return h > 0 ? `em ${h} h ${pad(m)} min` : `em ${m} min`; }

const BY_ID = Object.fromEntries(BANK.map(w => [w.id, w]));

const CONJ_OVR = {
  coibir:{pres:['coíbo','coíbe','coibimos','coíbem'], perf:['coibi','coibiu','coibimos','coibiram'], imp:['coibia','coibia','coibíamos','coibiam'], part:'coibido', ger:'coibindo'},

};
function conjugate(inf){
  const stem = inf.slice(0, -2), end = inf.slice(-2);
  if (end === 'ar'){
    let s1 = stem;
    if (stem.endsWith('c')) s1 = stem.slice(0, -1) + 'qu';
    else if (stem.endsWith('g')) s1 = stem + 'u';
    else if (stem.endsWith('ç')) s1 = stem.slice(0, -1) + 'c';
    return {pres:[stem+'o', stem+'a', stem+'amos', stem+'am'], perf:[s1+'ei', stem+'ou', stem+'amos', stem+'aram'], imp:[stem+'ava', stem+'ava', stem+'ávamos', stem+'avam'], part:stem+'ado', ger:stem+'ando'};
  }
  let s0 = stem;
  if (stem.endsWith('c')) s0 = stem.slice(0, -1) + 'ç';
  else if (stem.endsWith('g')) s0 = stem.slice(0, -1) + 'j';
  if (end === 'er') return {pres:[s0+'o', stem+'e', stem+'emos', stem+'em'], perf:[stem+'i', stem+'eu', stem+'emos', stem+'eram'], imp:[stem+'ia', stem+'ia', stem+'íamos', stem+'iam'], part:stem+'ido', ger:stem+'endo'};
  if (end === 'ir') return {pres:[s0+'o', stem+'e', stem+'imos', stem+'em'], perf:[stem+'i', stem+'iu', stem+'imos', stem+'iram'], imp:[stem+'ia', stem+'ia', stem+'íamos', stem+'iam'], part:stem+'ido', ger:stem+'indo'};
  return null;
}
const conjOf = w => w.verb ? (w.conj || CONJ_OVR[w.verb] || conjugate(w.verb)) : null;

// ---------- estado e gravação ----------
const LS_KEY = 'caderno-palavras-v1', LS_EXTRA = 'caderno-palavras-extra-v1';
const freshState = () => ({v:1, known:[], learned:[], pending:[], stats:{}, daysDone:[], today:null, updatedAt:0});
function lsGet(k){ try { const t = localStorage.getItem(k); return t ? JSON.parse(t) : null; } catch (e) { return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
function sane(s){ const f = freshState(); if (!s || typeof s !== 'object') return f; for (const k of Object.keys(f)) if (s[k] === undefined) s[k] = f[k]; return s; }

let S = sane(lsGet(LS_KEY));
let DB = null, SYNC = lsSet('caderno-palavras-probe', 1) ? 'local' : 'none';
let writing = false, dirty = false;
async function save(){
  S.updatedAt = Date.now();
  lsSet(LS_KEY, S);
  if (!DB) return;
  if (writing){ dirty = true; return; }
  writing = true;
  try { await DB.doc('progress/main').set(clone(S)); SYNC = 'cloud'; }
  catch (e) { if (e && (e.code === 'invalid_argument' || e.code === 'revoked' || e.code === 'not_granted')){ DB = null; SYNC = 'local'; } else SYNC = 'retry'; }
  writing = false;
  renderMeta();
  if (dirty){ dirty = false; save(); }
}

// ---------- ciclo diário ----------
const isLearned = id => S.learned.some(l => l.id === id);
const usable = id => !!word(id) && !S.known.includes(id) && !isLearned(id);
function isFresh(id){ return usable(id) && !S.pending.includes(id) && !(S.today && S.today.options.includes(id)); }

function topUp(){
  const t = S.today;
  const rng = rngFrom(`pool|${t.day}|${S.known.length}|${t.options.length}`);
  const fresh = shuffle(allIds().filter(isFresh), rng);
  while (t.options.length < 5 && fresh.length) t.options.push(fresh.shift());
  while (t.options.length < 5 && S.pending.length){ const id = S.pending.shift(); if (usable(id) && !t.options.includes(id)){ t.options.push(id); t.carried.push(id); } }
}
function ensureDay(){
  const k = dayKey();
  if (S.today && S.today.day === k){ if (S.today.stage === 'pick') topUp(); return false; }
  if (S.today){
    const left = S.today.options.filter(id => id !== S.today.chosen && usable(id));
    S.pending = S.pending.filter(id => !left.includes(id)).concat(left);
  }
  S.pending = S.pending.filter(usable);
  // até 3 palavras que ficaram de dias anteriores + novas até completar 5
  const carried = S.pending.slice(0, 3);
  S.pending = S.pending.slice(3);
  S.today = {day:k, options:carried.slice(), carried:carried.slice(), chosen:null, stage:'pick', attempt:0, quiz:null, result:null, reviewIds:[]};
  topUp();
  return true;
}
function reviewIdsFor(t){
  const prev = S.learned.filter(l => !(l.day === t.day && l.id === t.chosen));
  const ids = [];
  for (let i = prev.length - 1; i >= 0 && ids.length < REVIEW_WORDS; i--){ const id = prev[i].id; if (!ids.includes(id) && word(id)) ids.push(id); }
  return ids;
}
function streak(){
  const set = new Set(S.daysDone); const d = dayDate(dayKey()); let n = 0;
  if (!set.has(keyOf(d))) d.setDate(d.getDate() - 1);
  while (set.has(keyOf(d))){ n++; d.setDate(d.getDate() - 1); }
  return n;
}

// ---------- perguntas ----------
function wordQuestions(w, rng){
  const out = [];
  const others = shuffle(BANK_IDS.filter(id => id !== w.id), rng).slice(0, 3).map(id => BY_ID[id].g);
  out.push({t:'mc', k:'Significado', p:`O que significa “${w.w}”?`, o:shuffle([w.g, ...others], rng), a:w.g, e:w.def});
  const typedIdx = Math.floor(rng() * w.q.length);
  w.q.forEach((c, i) => {
    if (i === typedIdx) out.push({t:'type', k:'Escreva a forma certa', p:c[0], hint:c[4] || w.w, a:c[1], e:c[3], cz:true});
    else out.push({t:'mc', k:'Complete a frase', p:c[0], o:shuffle([c[1], ...c[2]], rng), a:c[1], e:c[3], cz:true});
  });
  out.push({t:'mc', k:'Uso correto', p:`Em qual frase “${w.w}” foi usada do jeito certo?`, o:shuffle([w.u[0], ...w.u[1]], rng), a:w.u[0], e:w.u[2]});
  return out;
}
function buildQuiz(t){
  const rng = rngFrom(`quiz|${t.day}|${t.chosen}|${t.attempt}`);
  const qs = [];
  const w = word(t.chosen);
  if (w){ const own = wordQuestions(w, rng); const first = own.shift(); [first, ...shuffle(own, rng)].forEach(q => { q.sec = 'hoje'; q.wid = w.id; qs.push(q); }); }
  const rev = [];
  for (const id of t.reviewIds){
    const rw = word(id); if (!rw) continue;
    const pool = wordQuestions(rw, rng);
    const a = pick(pool.filter(q => q.cz), rng);
    const b = pick(pool.filter(q => q !== a), rng);
    [a, b].forEach(q => { q.sec = 'rev'; q.wid = id; rev.push(q); });
  }
  return qs.concat(shuffle(rev, rng));
}
let Q = null;
function quiz(){ if (!Q && S.today && S.today.quiz) Q = buildQuiz(S.today); return Q; }

// ---------- ações ----------
let VIEW = {tab:'hoje', peek:null};
function choose(id){
  const t = S.today; if (t.chosen || !word(id)) return;
  t.chosen = id; t.stage = 'learn';
  S.learned.push({id, day:t.day, score:null});
  save(); render(true);
}
function unchoose(){
  const t = S.today; if (t.stage !== 'learn') return;
  S.learned = S.learned.filter(l => !(l.id === t.chosen && l.day === t.day));
  t.chosen = null; t.stage = 'pick';
  save(); render(true);
}
function markKnown(id){
  const t = S.today, w = word(id); if (!w) return;
  const snap = {options:t.options.slice(), carried:t.carried.slice(), pending:S.pending.slice()};
  if (!S.known.includes(id)) S.known.push(id);
  t.options = t.options.filter(x => x !== id);
  S.pending = S.pending.filter(x => x !== id);
  topUp(); save(); render();
  toast(`“${w.w}” não será mais sugerida.`, 'Desfazer', () => {
    S.known = S.known.filter(x => x !== id);
    t.options = snap.options; t.carried = snap.carried; S.pending = snap.pending;
    save(); render();
  });
}
function restoreKnown(id){ S.known = S.known.filter(x => x !== id); if (!S.pending.includes(id)) S.pending.push(id); save(); render(); toast(`“${word(id).w}” volta a aparecer nas sugestões.`); }
function startQuiz(){
  const t = S.today; if (!t.chosen) return;
  t.reviewIds = reviewIdsFor(t);
  t.attempt = (t.attempt || 0) + 1;
  t.stage = 'quiz'; t.quiz = {i:0, res:[], ans:[], acc:[]}; t.result = null;
  Q = buildQuiz(t);
  save(); render(true);
}
function checkTyped(q, val){
  const n = norm(val), a = norm(q.a);
  if (n === a) return {ok:true};
  if (strip(n) === strip(a)) return {ok:true, accent:true};
  return {ok:false};
}
function answer(val){
  const t = S.today, qz = t.quiz, q = quiz()[qz.i];
  if (!q || qz.res[qz.i] !== undefined) return;
  let ok, accent = false;
  if (q.t === 'mc') ok = val === q.a;
  else { if (!norm(val)) return; const r = checkTyped(q, val); ok = r.ok; accent = !!r.accent; }
  qz.res[qz.i] = ok; qz.ans[qz.i] = String(val); qz.acc[qz.i] = accent;
  const st = S.stats[q.wid] || (S.stats[q.wid] = {ok:0, err:0});
  ok ? st.ok++ : st.err++;
  save(); render();
  setTimeout(() => { const b = document.getElementById('btn-next'); if (b) b.focus({preventScroll:true}); }, 30);
}
function next(){
  const t = S.today, qz = t.quiz, qs = quiz();
  if (qz.res[qz.i] === undefined) return;
  if (qz.i < qs.length - 1){ qz.i++; save(); render(true); return; }
  let th = 0, tt = 0, rh = 0, rt = 0;
  qs.forEach((q, i) => { if (q.sec === 'hoje'){ tt++; if (qz.res[i]) th++; } else { rt++; if (qz.res[i]) rh++; } });
  t.result = {hoje:[th, tt], rev:[rh, rt]};
  t.stage = 'done';
  const le = S.learned.find(l => l.id === t.chosen && l.day === t.day);
  if (le && !le.score) le.score = [th, tt];
  if (!S.daysDone.includes(t.day)) S.daysDone.push(t.day);
  save(); render(true);
}

const CAN_SPEAK = typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined';
function speak(text){
  if (!CAN_SPEAK) return;
  try {

const isStr = v => typeof v === 'string' && v.trim().length > 0;
const strList = v => Array.isArray(v) ? v.filter(isStr).map(String).slice(0, 6) : [];
function validateWord(r){
  try {
    if (!r || typeof r !== 'object' || !isStr(r.w) || !isStr(r.def) || !isStr(r.g)) return null;
    const id = strip(String(r.w)).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    if (!id) return null;
    const fam = (Array.isArray(r.fam) ? r.fam : []).filter(f => Array.isArray(f) && isStr(f[0])).map(f => [String(f[0]), String(f[1] || ''), String(f[2] || '')]).slice(0, 5);
    const ex = strList(r.ex).slice(0, 4);
    const q = (Array.isArray(r.q) ? r.q : []).filter(x => Array.isArray(x) && isStr(x[0]) && x[0].includes('___') && isStr(x[1]) && Array.isArray(x[2]))
      .map(x => [String(x[0]), String(x[1]), x[2].filter(isStr).map(String).filter(d => norm(d) !== norm(x[1])).slice(0, 3), String(x[3] || ''), String(x[4] || r.verb || r.w)])
      .filter(x => x[2].length >= 2).slice(0, 5);
    const u = Array.isArray(r.u) && isStr(r.u[0]) && Array.isArray(r.u[1]) && r.u[1].filter(isStr).length ? [String(r.u[0]), r.u[1].filter(isStr).map(String).slice(0, 3), String(r.u[2] || '')] : null;
    if (ex.length < 2 || q.length < 3 || !u) return null;
    const w = {id, w:String(r.w), c:String(r.c || ''), syl:isStr(r.syl) ? String(r.syl) : String(r.w), def:String(r.def), g:String(r.g), fam:fam.length ? fam : [[String(r.w), String(r.c || ''), String(r.g)]], ex, q, u, syn:strList(r.syn), ant:strList(r.ant), tip:isStr(r.tip) ? String(r.tip) : '', gen:true};
    if (isStr(r.verb)){
      w.verb = String(r.verb);
      const c = r.conj;
      if (c && ['pres', 'perf', 'imp'].every(k => Array.isArray(c[k]) && c[k].length === 4 && c[k].every(isStr)) && isStr(c.part) && isStr(c.ger))
        w.conj = {pres:c.pres.map(String), perf:c.perf.map(String), imp:c.imp.map(String), part:String(c.part), ger:String(c.ger)};
    }
    return w;
  } catch (e) { return null; }
}
function genPrompt(){
  const used = allIds().map(id => word(id).w).concat(['dissimulação', 'dissimular']);
  const sample = Object.assign({}, BY_ID.mitigar); delete sample.id;
  return `Você é professor de português do Brasil. Um adulto nativo com vocabulário limitado quer aprender uma palavra nova por dia: palavras cultas, mas úteis no dia a dia, no trabalho e no noticiário (nível de "dissimulação", "mitigar", "perspicaz", "idôneo").

Crie 8 palavras NOVAS. Não repita nenhuma destas (nem formas da mesma família): ${used.join(', ')}.
Prefira palavras com família rica (verbo + substantivo + adjetivo) e evite termos raros demais ou regionais.

Responda SOMENTE com um array JSON de 8 objetos, cada um exatamente neste formato (exemplo real):
${JSON.stringify(sample)}

Regras de cada campo:
- "w": a palavra principal. "c": "v", "sf", "sm", "adj" ou "adv".
- "syl": sílabas separadas por "-" com "^" antes da sílaba tônica.
- "def": definição simples, em uma frase. "g": sentido curtíssimo (até 6 palavras).
- "fam": 2 a 4 formas da família; a primeira é a própria palavra: [forma, classe, sentido curto].
- "verb": infinitivo do verbo da família, se existir (senão omita). Com verbo, inclua "conj": {"pres":[eu, ele, nós, eles], "perf":[eu, ele, nós, eles], "imp":[eu, ele, nós, eles], "part":"...", "ger":"..."} com as formas corretas.
- "ex": 3 frases naturais do dia a dia, com a forma da palavra entre asteriscos.
- "q": 4 itens [frase com ___, resposta, [3 formas erradas da mesma família], explicação curta da gramática, palavra base]. Use marcadores de tempo (ontem, todo dia, no ano passado) para que só UMA resposta caiba; nenhuma alternativa errada pode completar a frase corretamente. Varie as classes e os tempos verbais.
- "u": [frase com uso correto, [2 frases com uso errado], explicação curta].
- "syn", "ant": até 4 palavras cada. "tip": uma dica curta de uso, grafia ou confusão comum.`;
}

async function generate(){
  if (!SAMPLE || GEN.busy) return;
  GEN = {busy:true, msg:'O Claude está escolhendo palavras novas. Isso pode levar até um minuto.'};
  render();
  try {
    const out = await SAMPLE.json(genPrompt(), {modelTier:'default'});
    const arr = Array.isArray(out) ? out : (out && Array.isArray(out.words) ? out.words : []);
    let added = 0;
    for (const raw of arr){
      const w = validateWord(raw);
      if (!w || word(w.id)) continue;
      EXTRA[w.id] = w; added++;
      await persistWord(w);
    }
    lsSet(LS_EXTRA, EXTRA);
    GEN = {busy:false, msg: added ? `${added} palavras novas entraram no banco.` : 'Não recebi palavras válidas. Tente de novo.'};
    if (added && S.today.stage === 'pick') topUp();
    save();
  } catch (e) {
    const c = e && e.code;
    GEN = {busy:false, msg: c === 'not_granted' ? 'Sem permissão para usar o Claude nesta página.' : c === 'rate_limited' ? 'Muitos pedidos seguidos. Tente de novo em alguns minutos.' : 'Não foi possível gerar agora. Tente mais tarde.'};
    if (c === 'not_granted' || c === 'sampling_disabled') SAMPLE = null;
  }
  render();
}

// ---------- início ----------
function loadExtras(obj){ if (!obj || typeof obj !== 'object') return; for (const k of Object.keys(obj)){ const w = validateWord(obj[k]); if (w && !BY_ID[w.id]) EXTRA[w.id] = w; } }
loadExtras(lsGet(LS_EXTRA));
if (ensureDay()) lsSet(LS_KEY, S);
render();

(async () => {
  const c = window.claude;
  if (!c || typeof c.use !== 'function') return;
  c.use('sample').then(s => { if (s){ SAMPLE = s; if (VIEW.tab === 'lista' || S.today.options.length < 5) render(); } }).catch(() => {});
  let db = null;
  try { db = await c.use('db'); } catch (e) {}
  if (!db) return;
  try {
    const snap = await db.doc('progress/main').get();
    DB = db;
    // A versão mais recente vence: permite usar o caderno em mais de um aparelho.
    let push = !snap.exists;
    if (snap.exists){
      const remote = sane(clone(snap.data()));
      if ((remote.updatedAt || 0) >= (S.updatedAt || 0)){ S = remote; Q = null; } else push = true;
    }
    try { const ws = await db.collection('words').get(); ws.docs.forEach(d => { const w = validateWord(d.data()); if (w && !BY_ID[w.id]) EXTRA[w.id] = w; }); lsSet(LS_EXTRA, EXTRA); } catch (e) {}
    if (ensureDay()) push = true;
    SYNC = 'cloud';
    if (push) await save(); else lsSet(LS_KEY, S);
    render();
  } catch (e) { DB = null; renderMeta(); }
})();
</script>
